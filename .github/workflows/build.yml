name: Build Cross-Platform Apps

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 手动触发，支持自定义参数
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      build_macos:
        description: '构建 macOS 版本'
        required: true
        default: true
        type: boolean
      build_windows:
        description: '构建 Windows 版本'
        required: true
        default: true
        type: boolean
      build_linux:
        description: '构建 Linux 版本'
        required: false
        default: false
        type: boolean
      create_release:
        description: '创建 GitHub Release (构建完成后自动发布)'
        required: false
        default: false
        type: boolean
      release_draft:
        description: '创建为草稿 Release (可后续编辑后发布)'
        required: false
        default: false
        type: boolean
      python_version:
        description: 'Python 版本'
        required: false
        default: '3.10'
        type: string

jobs:
  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || inputs.build_macos
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.10' }}
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: 🔨 Build application
      run: |
        python -m PyInstaller --clean --noconfirm dataset_manager.spec
      env:
        APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    
    - name: 📦 Package application
      run: |
        cd dist
        zip -r DatasetManager-macOS-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}.zip DatasetManager.app
        cd ..
    
    - name: ⬆️ Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DatasetManager-macOS-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        path: dist/*.zip
        retention-days: 30
  
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.10' }}
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: 🔨 Build application
      run: |
        python -m PyInstaller --clean --noconfirm dataset_manager.spec
      env:
        APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    
    - name: 📦 Package application
      run: |
        cd dist
        7z a DatasetManager-Windows-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}.zip DatasetManager.exe
        cd ..
      shell: bash
    
    - name: ⬆️ Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DatasetManager-Windows-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        path: dist/*.zip
        retention-days: 30
  
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    continue-on-error: true  # Linux 构建失败不影响其他平台
    if: github.event_name != 'workflow_dispatch' || inputs.build_linux
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ github.event_name == 'workflow_dispatch' && inputs.python_version || '3.10' }}
    
    - name: 📦 Install system dependencies for PyQt6
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxcb-xinerama0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-cursor0 \
          libxkbcommon-x11-0 \
          libgl1 \
          libegl1-mesa \
          libdbus-1-3 \
          libxkbcommon0 \
          libfontconfig1 \
          libfreetype6 \
          x11-utils \
          xvfb \
          libopengl0 \
          libglib2.0-0 \
          libglu1-mesa
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: 🔨 Build application (with virtual display)
      run: |
        xvfb-run -a python -m PyInstaller --clean --noconfirm dataset_manager.spec
      env:
        APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        QT_QPA_PLATFORM: offscreen
        DISPLAY: ':99'
    
    - name: 📦 Package application
      if: success()
      run: |
        cd dist
        tar -czf DatasetManager-Linux-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}.tar.gz DatasetManager
        cd ..
    
    - name: ⬆️ Upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: DatasetManager-Linux-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        path: dist/*.tar.gz
        retention-days: 30
  
  # 创建 Release（手动触发勾选或推送 tag 时自动创建）
  create_release:
    name: 🚀 Create Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    # 满足以下任一条件时创建 Release：
    # 1. 手动触发且勾选了 create_release
    # 2. 推送了版本标签 (v*)
    # 注意：Linux 构建失败不影响 Release 创建
    if: |
      always() &&
      (needs.build-macos.result == 'success' || needs.build-windows.result == 'success') &&
      ((github.event_name == 'workflow_dispatch' && inputs.create_release) ||
      startsWith(github.ref, 'refs/tags/v'))
    
    steps:
    - name: 📥 Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: 📋 Display artifacts structure
      run: |
        echo "Artifacts downloaded:"
        ls -R artifacts
        echo ""
        echo "Preparing files for release..."
    
    - name: 📦 Prepare release files
      run: |
        mkdir -p release_files
        find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release_files/ \;
        echo "Files to be released:"
        ls -lh release_files/
    
    - name: 🚀 Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        name: 📦 Dataset Manager ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        draft: ${{ github.event_name == 'workflow_dispatch' && inputs.release_draft || false }}
        prerelease: false
        generate_release_notes: true
        body: |
          ## 📦 Dataset Manager Release
          
          ### 🎉 Version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          
          **Built on:** ${{ github.event.head_commit.timestamp }}
          **Commit:** ${{ github.sha }}
          
          ---
          
          ### 📥 Downloads:
          
          Choose the appropriate file for your operating system:
          
          | Platform | File | Description |
          |----------|------|-------------|
          | 🍎 **macOS** | `DatasetManager-macOS-*.zip` | Mac application bundle (.app) |
          | 🪟 **Windows** | `DatasetManager-Windows-*.zip` | Windows executable (.exe) |
          | 🐧 **Linux** | `DatasetManager-Linux-*.tar.gz` | Linux executable |
          
          ---
          
          ### 🔧 Installation Instructions:
          
          #### macOS:
          1. Download `DatasetManager-macOS-*.zip`
          2. Extract the ZIP file (double-click)
          3. Move `DatasetManager.app` to your Applications folder
          4. **First launch:** Right-click the app and select "Open" (this bypasses Gatekeeper)
          5. For subsequent launches, just double-click the app
          
          #### Windows:
          1. Download `DatasetManager-Windows-*.zip`
          2. Extract the ZIP file (right-click → Extract All)
          3. Run `DatasetManager.exe`
          4. If Windows Defender shows a warning, click "More info" → "Run anyway"
          
          #### Linux:
          1. Download `DatasetManager-Linux-*.tar.gz`
          2. Extract: `tar -xzf DatasetManager-Linux-*.tar.gz`
          3. Make executable: `chmod +x DatasetManager`
          4. Run: `./DatasetManager`
          
          ---
          
          ### 📝 Release Notes:
          
          This release was automatically built and published by GitHub Actions.
          
          **What's included:**
          - ✅ PyQt6-based GUI application
          - ✅ Dataset management tools
          - ✅ Auto-annotation features
          - ✅ Model validation capabilities
          - ✅ Remote server integration
          
          ---
          
          ### 🐛 Issues?
          
          If you encounter any problems, please [open an issue](../../issues/new).
          
          ---
          
          **Built automatically by GitHub Actions** ⚡
        files: |
          release_files/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: ✅ Release created successfully
      run: |
        echo "🎉 Release created successfully!"
        echo "📦 Version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
        echo "🔗 View release: ${{ github.server_url }}/${{ github.repository }}/releases"
